name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      attest_artifacts:
        description: Attest release artifacts for the final public candidate
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  preflight:
    name: Linux preflight / Python 3.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --dev --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src tests
      - name: Run tests in randomized order
        run: uv run pytest
      - name: Enforce beta-core module coverage
        run: uv run python .github/scripts/check_module_coverage.py coverage.json

  quality:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
            experimental: false
          - os: ubuntu-latest
            python: "3.12"
            experimental: false
          - os: ubuntu-latest
            python: "3.14"
            experimental: false
          - os: windows-latest
            python: "3.11"
            experimental: false
          - os: windows-latest
            python: "3.12"
            experimental: false
          - os: windows-latest
            python: "3.14"
            experimental: false
          - os: macos-latest
            python: "3.12"
            experimental: true
          - os: macos-latest
            python: "3.14"
            experimental: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --dev --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src tests
      - name: Run tests in randomized order
        run: uv run pytest

  release-artifact:
    name: Release artifact / Python 3.11
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.11"
      - name: Verify lockfile
        run: uv lock --check
      - name: Build wheel and source distribution
        run: uv build --out-dir dist
      - name: Inspect release artifact contents
        run: python .github/scripts/inspect_release_artifacts.py dist/*.whl dist/*.tar.gz
      - name: Create and verify SHA-256 checksums
        run: |
          cd dist
          sha256sum -- *.whl *.tar.gz > SHA256SUMS
          cd ..
          python .github/scripts/verify_sha256s.py dist/SHA256SUMS
      - name: Install wheel into a clean environment
        run: |
          mkdir -p "$RUNNER_TEMP/llamatune-wheel-smoke/bin"
          uv venv --python 3.11 "$RUNNER_TEMP/llamatune-wheel-smoke/venv"
          uv pip install \
            --python "$RUNNER_TEMP/llamatune-wheel-smoke/venv/bin/python" \
            dist/*.whl
          cp tests/fixtures/fake_llama_bench.py \
            "$RUNNER_TEMP/llamatune-wheel-smoke/bin/llama-bench"
          chmod +x "$RUNNER_TEMP/llamatune-wheel-smoke/bin/llama-bench"
          "$RUNNER_TEMP/llamatune-wheel-smoke/venv/bin/python" \
            .github/scripts/artifact_smoke.py create-model \
            "$RUNNER_TEMP/llamatune-wheel-smoke/tiny.gguf"
      - name: Smoke-test the installed wheel
        run: |
          cd "$RUNNER_TEMP/llamatune-wheel-smoke"
          "venv/bin/python" -I -c \
            'import llamatune; print(llamatune.__file__)' > module-path.txt
          "venv/bin/llamatune" --help > help.txt
          "venv/bin/llamatune" scan --llama-bin bin --json > scan.json
          set +e
          LLAMATUNE_FAKE_CORES=4 "venv/bin/llamatune" tune tiny.gguf \
            --llama-bin bin \
            --sessions-dir sessions \
            --budget-trials 12 \
            --budget-minutes 2 \
            --baseline-runs 3 \
            --reps-search 2 \
            --reps-confirm 3 \
            --quiet \
            --json > tune.json
          tune_exit=$?
          set -e
          printf '%s\n' "$tune_exit" > tune-exit.txt
          if (( tune_exit > 1 )); then
            exit "$tune_exit"
          fi
          "venv/bin/python" "$GITHUB_WORKSPACE/.github/scripts/artifact_smoke.py" \
            verify "$RUNNER_TEMP/llamatune-wheel-smoke"
      - name: Retain release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: llamatune-release-${{ github.sha }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  attest-artifacts:
    name: Attest release artifacts
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.attest_artifacts }}
    needs: release-artifact
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download exact release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: llamatune-release-${{ github.sha }}
          path: dist
      - name: Verify artifact contents and checksums
        run: |
          python .github/scripts/inspect_release_artifacts.py dist/*.whl dist/*.tar.gz
          python .github/scripts/verify_sha256s.py dist/SHA256SUMS
      - name: Attest verified release artifacts
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS

  windows-wheel:
    name: Windows wheel install / Python 3.12
    needs: release-artifact
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Download exact release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: llamatune-release-${{ github.sha }}
          path: dist
      - name: Verify artifact contents and checksums
        run: |
          python .github/scripts/inspect_release_artifacts.py `
            (Get-ChildItem dist/*.whl).FullName `
            (Get-ChildItem dist/*.tar.gz).FullName
          python .github/scripts/verify_sha256s.py dist/SHA256SUMS
      - name: Install and import the exact wheel
        run: |
          $venv = Join-Path $env:RUNNER_TEMP "llamatune-wheel-smoke"
          $python = Join-Path $venv "Scripts/python.exe"
          $command = Join-Path $venv "Scripts/llamatune.exe"
          $wheel = (Get-ChildItem dist/*.whl).FullName
          uv venv --python 3.12 $venv
          uv pip install --python $python $wheel
          & $python -I -c "import llamatune; print(llamatune.__file__)"
          & $command --help
